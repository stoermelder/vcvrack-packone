name: Build MetaModule plugin

on:
  workflow_dispatch:
    inputs:
      SDK_branch:
        description: 'MetaModule SDK branch'
        required: true
        type: choice
        options:
          - main
          - v2.0-dev
      do_release:
        description: 'Create Release (must select Tag above)'
        required: true
        default: false
        type: boolean

jobs:
  build-lin:
    strategy:
        matrix:
          gcc: ['12.3.Rel1']
    name: "Build plugin on linux"
    runs-on: ubuntu-24.04
    steps:
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ matrix.gcc }}
      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'
      - name: Git setup
        run: git config --global --add safe.directory '*'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build
      - name: Set Release Version
        if: startsWith(github.ref, 'refs/tags/')
        uses: FranzDiebold/github-env-vars-action@v2
      - name: Build
        run: |
          cd metamodule
          mkdir -p metamodule-plugins
          # Get the SDK
          git clone -b ${{ inputs.SDK_branch }} https://github.com/4ms/metamodule-plugin-sdk --recursive 
          # Validate plugin-mm.json syntax
          jq -e . plugin-mm.json >/dev/null || exit 1
          # Build the plugin
          cmake -B build -G Ninja -DMETAMODULE_SDK_DIR=metamodule-plugin-sdk
          cmake --build build
      - name: Rename plugin for release
        if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
        run: |
          # Add version tag to the plugin file name:
          cd metamodule-plugins && for f in *.mmplugin; do mv $f ${f%.mmplugin}-${{ env.CI_REF_NAME }}.mmplugin; done;
      - name: Rename plugin
        if: ${{ ! inputs.do_release }}
        run: |
          gitrev=`git rev-parse --short HEAD`
          cd metamodule
          cd metamodule-plugins && for f in *.mmplugin; do mv $f ${f%.mmplugin}-v2.mm.$gitrev.mmplugin; done;
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: metamodule/metamodule-plugins/*.mmplugin
          name: mmplugin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release: ${{ env.CI_REF_NAME }}"
          files: |
            metamodule-plugins/*.mmplugin

  publish-nightly:
    name: Publish Nightly-MetaModule
    if: ${{ github.ref == 'refs/heads/v2-dev' && github.repository_owner == 'stoermelder' && ! inputs.do_release }}
    runs-on: ubuntu-latest
    needs: [build-lin]
    steps:
      - uses: actions/checkout@v6
      - name: Delete Nightly release
        run: |
          gh release delete Nightly-MetaModule --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
      - name: Create Nighty release
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly-MetaModule
          tag_name: Nightly-MetaModule
          draft: false
          prerelease: true
          files: |
            _artifacts/**/*.vcvplugin