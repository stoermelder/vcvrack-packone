name: Build MetaModule plugin

on:
  workflow_dispatch:
    inputs:
      SDK_branch:
        description: 'MetaModule SDK branch'
        required: true
        type: choice
        options:
          - main
          - v2.0-dev
      do_release:
        description: 'Create Release (must select Tag above)'
        required: true
        default: false
        type: boolean

jobs:
  build-lin:
    strategy:
        matrix:
          gcc: ['12.3.Rel1']
    name: "Build firmware on linux"
    runs-on: ubuntu-24.04
    steps:
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ matrix.gcc }}

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.26.x'

      - name: Git setup
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build

      - name: Set Release Version
        if: startsWith(github.ref, 'refs/tags/')
        uses: FranzDiebold/github-env-vars-action@v2

      - name: Build
        run: |
          cd metamodule
          mkdir -p metamodule-plugins
          # Get the SDK
          git clone -b ${{ inputs.SDK_branch }} https://github.com/4ms/metamodule-plugin-sdk --recursive 
          # Validate plugin-mm.json syntax
          jq -e . plugin-mm.json >/dev/null || exit 1
          # Build the plugin
          cmake -B build -G Ninja -DMETAMODULE_SDK_DIR=metamodule-plugin-sdk
          cmake --build build

      - name: Rename plugin for release
        if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
        run: |
          # Add version tag to the plugin file name:
          cd metamodule-plugins && for f in *.mmplugin; do mv $f ${f%.mmplugin}-${{ env.CI_REF_NAME }}.mmplugin; done;

      - name: Rename plugin
        if: ${{ ! inputs.do_release }}
        run: |
          gitrev=`git rev-parse --short HEAD`
          cd metamodule
          cd metamodule-plugins && for f in *.mmplugin; do mv $f ${f%.mmplugin}-v2.mm.$gitrev.mmplugin; done;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: metamodule/metamodule-plugins/*.mmplugin
          name: mmplugin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release: ${{ env.CI_REF_NAME }}"
          files: |
            metamodule-plugins/*.mmplugin

  publish-nightly:
    name: Publish Nightly-MetaModule
    if: ${{ github.ref == 'refs/heads/v2-dev' && github.repository_owner == 'stoermelder' && ! inputs.do_release }}
    runs-on: ubuntu-latest
    needs: [build-lin]
    steps:
      - uses: actions/download-artifact@v4.1.7
        with:
          path: _artifacts
      - name: Extract artifact
        run: |
          unzip _artifacts/**/*.zip
      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: Nightly-MetaModule # This may also be of the form 'refs/tags/staging'
          assets: '*'
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _artifacts/**/*.mmplugin
          tag: Nightly-MetaModule
          file_glob: true